name: Update

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

jobs:
  update:
    name: Update
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Use patched nix-update from this repository
        run: nix registry add nixpkgs "git+file:$PWD"

      - name: Update packages
        uses: gepbird/nix-update-action@ef2bd6bf79cd36d23bf03267e210c9e5c2f5626f # v3.1.3
        with:
          token: ${{ secrets.NIX_UPDATE_PAT }}
          blacklist: telegram-desktop
          pr-body: |
            Automated changes by the [nix-update-actions](https://github.com/gepbird/nix-update-action) GitHub Action.
