name: Update

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

jobs:
  update:
    name: Update
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # https://github.com/gepbird/nix-update-action/issues/2
      - name: Archive nixpkgs
        run: nix flake archive --json nixpkgs > /dev/null

      - name: Update packages
        uses: gepbird/nix-update-action@8e91c9bd11e4269d1df1c49cc2ff35471334e346 # v3.1.2
        with:
          token: ${{ secrets.NIX_UPDATE_PAT }}
          # Temporarily pause mpv updates until nixpkgs provides libplacebo >= 7.387.0.
          packages: codex,mcp-victorialogs,mcp-victoriametrics,mcp-victoriatraces
          pr-body: |
            Automated changes by the [nix-update-actions](https://github.com/gepbird/nix-update-action) GitHub Action.
